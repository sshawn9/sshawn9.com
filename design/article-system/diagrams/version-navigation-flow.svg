<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">多版本文章阅读与比较流</title>
  <desc id="desc">展示当前文章、历史版本和自由双版本比较之间的统一导航关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07141c"/>
      <stop offset=".55" stop-color="#080c15"/>
      <stop offset="1" stop-color="#140e23"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .h1 { font: 800 44px ui-sans-serif, system-ui; fill: #f1f5f9; }
      .h2 { font: 800 24px ui-sans-serif, system-ui; fill: #f1f5f9; }
      .p { font: 500 15px ui-sans-serif, system-ui; fill: #9aa8bc; }
      .mono { font: 700 12px ui-monospace, monospace; fill: #67e8f9; letter-spacing: 1.2px; }
      .crumb { font: 600 14px ui-sans-serif, system-ui; fill: #a5b4c8; }
      .card { fill: #101827; stroke: #29364d; stroke-width: 1.5; }
      .current { fill: #0d2028; stroke: #22d3ee; stroke-width: 2; }
      .history { fill: #211929; stroke: #fbbf24; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <text class="h1" x="90" y="88">多版本文章 · 阅读与比较逻辑</text>
  <text class="p" x="90" y="126">版本选择留在文章页；比较页只负责自由选择两个版本并展示差异</text>

  <g filter="url(#shadow)">
    <rect class="current" x="105" y="220" width="430" height="230" rx="24"/>
    <text class="mono" x="140" y="260">CURRENT ARTICLE</text>
    <text class="crumb" x="140" y="296">文章 / 文章标题</text>
    <text class="h2" x="140" y="342">当前版本 v4</text>
    <text class="p" x="140" y="378">默认 URL；唯一 canonical；进入正文阅读</text>
    <text class="p" x="140" y="410">选择阅读版本 · 打开双版本比较</text>

    <rect class="history" x="585" y="220" width="430" height="230" rx="24"/>
    <text class="mono" x="620" y="260">HISTORICAL SNAPSHOT</text>
    <text class="crumb" x="620" y="296">文章 / 文章标题 / v1</text>
    <text class="h2" x="620" y="342">历史版本 v1</text>
    <text class="p" x="620" y="378">完整旧快照；明确当前最新版为 v4</text>
    <text class="p" x="620" y="410">阅读当前版本 · 自由选择版本比较</text>

    <rect class="card" x="1065" y="220" width="430" height="230" rx="24"/>
    <text class="mono" x="1100" y="260">VERSION DIFF</text>
    <text class="crumb" x="1100" y="296">文章 / 文章标题 / 比较 v1 与 v4</text>
    <text class="h2" x="1100" y="342">比较 v1 与 v4</text>
    <text class="p" x="1100" y="378">版本 A 与版本 B 可自由选择</text>
    <text class="p" x="1100" y="410">相同版本禁用 · 阅读两个端点</text>
  </g>

  <path class="line" d="M535 300H585"/>
  <text class="p" x="540" y="284">选择 v1</text>
  <path class="line" d="M1015 330H1065"/>
  <text class="p" x="1020" y="314">比较</text>
  <path class="line" d="M535 410C760 600 1090 570 1190 450"/>
  <text class="p" x="790" y="566">自由选择两个版本</text>
  <path class="line" d="M585 390C470 560 315 550 315 450"/>
  <text class="p" x="350" y="540">阅读当前版本</text>

  <rect x="105" y="650" width="560" height="106" rx="18" fill="#0e1624" stroke="#27334a"/>
  <text class="mono" x="132" y="684">RULE</text>
  <text class="p" x="132" y="716">不建立独立版本历史页；不提供固定链接操作</text>
  <text class="p" x="132" y="744">面包屑表达层级；按钮和选择器只表达动作</text>
</svg>
