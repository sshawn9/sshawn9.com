<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">文章系统信息架构</title>
  <desc id="desc">从全局文章导航到文章索引、标签、文章和版本子页面的结构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="0.55" stop-color="#080c16"/>
      <stop offset="1" stop-color="#130d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526177"/>
    </marker>
    <style>
      .title { font: 800 44px ui-sans-serif, system-ui, sans-serif; fill: #eef4fb; }
      .sub { font: 500 18px ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .label { font: 800 20px ui-sans-serif, system-ui, sans-serif; fill: #eef4fb; }
      .route { font: 500 13px ui-monospace, SFMono-Regular, monospace; fill: #8ea0b7; }
      .note { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #67e8f9; }
      .card { fill: #101827; stroke: #263248; stroke-width: 1.5; }
      .current { fill: #0e2029; stroke: #22d3ee; stroke-width: 2; }
      .version { fill: #17142a; stroke: #7057a8; stroke-width: 1.5; }
      .line { fill: none; stroke: #526177; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".13" stroke="#7c8ba1">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600M0 560H1600M0 640H1600M0 720H1600M0 800H1600M0 880H1600M80 0V1000M160 0V1000M240 0V1000M320 0V1000M400 0V1000M480 0V1000M560 0V1000M640 0V1000M720 0V1000M800 0V1000M880 0V1000M960 0V1000M1040 0V1000M1120 0V1000M1200 0V1000M1280 0V1000M1360 0V1000M1440 0V1000M1520 0V1000"/>
  </g>

  <text class="title" x="90" y="90">文章系统 · 信息架构</text>
  <rect x="90" y="116" width="230" height="4" rx="2" fill="url(#accent)"/>
  <text class="sub" x="90" y="156">页面身份、父子关系和 URL 在排版之前确定</text>

  <g filter="url(#shadow)">
    <rect class="current" x="620" y="205" width="360" height="96" rx="22"/>
    <text class="note" x="650" y="238">GLOBAL NAVIGATION</text>
    <text class="label" x="650" y="270">文章</text>
    <text class="route" x="820" y="270">/blog/</text>

    <rect class="current" x="135" y="405" width="360" height="112" rx="22"/>
    <text class="note" x="165" y="440">CONTENT INDEX</text>
    <text class="label" x="165" y="474">文章索引</text>
    <text class="route" x="165" y="497">/blog/ · /blog/page/:page/</text>

    <rect class="card" x="620" y="405" width="360" height="112" rx="22"/>
    <text class="note" x="650" y="440">TAXONOMY</text>
    <text class="label" x="650" y="474">标签</text>
    <text class="route" x="650" y="497">/blog/tags/:tag/</text>

    <rect class="card" x="1105" y="405" width="360" height="112" rx="22"/>
    <text class="note" x="1135" y="440">READING</text>
    <text class="label" x="1135" y="474">当前文章</text>
    <text class="route" x="1135" y="497">/blog/:slug/</text>

    <rect class="version" x="430" y="705" width="320" height="112" rx="22"/>
    <text class="note" x="460" y="740">HISTORICAL SNAPSHOT</text>
    <text class="label" x="460" y="774">历史版本</text>
    <text class="route" x="460" y="797">/v/:version/</text>

    <rect class="version" x="850" y="705" width="320" height="112" rx="22"/>
    <text class="note" x="880" y="740">FREE VERSION PAIR</text>
    <text class="label" x="880" y="774">版本比较</text>
    <text class="route" x="880" y="797">/compare/:a...:b/</text>
  </g>

  <path class="line" d="M800 301V352H315V405"/>
  <path class="line" d="M800 301V405"/>
  <path class="line" d="M800 301V352H1285V405"/>
  <path class="line" d="M1285 517V620H590V705"/>
  <path class="line" d="M1285 517V620H1010V705"/>
  <path class="line" d="M620 461H495"/>

  <g transform="translate(90 900)">
    <circle cx="8" cy="8" r="8" fill="#22d3ee"/>
    <text class="sub" x="28" y="15">主入口 / 当前内容</text>
    <circle cx="240" cy="8" r="8" fill="#7057a8"/>
    <text class="sub" x="260" y="15">只在多版本文章存在</text>
  </g>
</svg>
