name: Deploy site to Cloudflare

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the verified site artifact
        required: true
        type: string
      deployment_type:
        description: Upload a preview version or deploy to production
        required: true
        type: string
    secrets:
      cloudflare_api_token:
        required: true
      unsplash_access_key:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.deployment_type }}
      url: ${{ inputs.deployment_type == 'production' && 'https://sshawn9.com' || steps.urls.outputs.stable-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: apps/site-v2/dist/
      - name: Validate deployment type
        shell: bash
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
        run: |
          case "$DEPLOYMENT_TYPE" in
            preview|production) ;;
            *) echo "deployment_type must be preview or production"; exit 1 ;;
          esac
      - name: Prepare Worker secrets
        shell: bash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.unsplash_access_key }}
        run: |
          set -euo pipefail
          if [[ -z "$UNSPLASH_ACCESS_KEY" ]]; then
            echo "UNSPLASH_ACCESS_KEY must not be empty." >&2
            exit 1
          fi
          node --input-type=module -e \
            'import { writeFileSync } from "node:fs"; writeFileSync(".wrangler-secrets.json", JSON.stringify({ UNSPLASH_ACCESS_KEY: process.env.UNSPLASH_ACCESS_KEY }));'
      - name: Create stable branch preview alias
        if: ${{ inputs.deployment_type == 'preview' && github.ref_name != 'main' }}
        id: preview
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          normalized="$(
            printf '%s' "$BRANCH_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g'
          )"
          normalized="${normalized:-branch}"
          if [[ ! "$normalized" =~ ^[a-z] ]]; then
            normalized="branch-$normalized"
          fi
          fingerprint="$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)"
          worker_name="sshawn9-com-preview"
          max_alias_length=$((63 - 1 - ${#worker_name}))
          max_base_length=$((max_alias_length - 1 - ${#fingerprint}))
          normalized="${normalized:0:max_base_length}"
          normalized="${normalized%-}"
          alias="$normalized-$fingerprint"

          if [[ ! "$alias" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Generated preview alias is invalid: $alias" >&2
            exit 1
          fi
          if (( ${#alias} + 1 + ${#worker_name} > 63 )); then
            echo "Generated preview alias exceeds the DNS label limit: $alias" >&2
            exit 1
          fi

          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          wranglerVersion: '4.120.0'
          command: ${{ inputs.deployment_type == 'production' && 'deploy --env="" --secrets-file .wrangler-secrets.json' || github.ref_name == 'main' && 'deploy --env preview --secrets-file .wrangler-secrets.json' || format('versions upload --env preview --preview-alias {0} --secrets-file .wrangler-secrets.json', steps.preview.outputs.alias) }}
      - name: Record deployment URLs
        id: urls
        shell: bash
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          BRANCH_NAME: ${{ github.ref_name }}
          PREVIEW_ALIAS: ${{ steps.preview.outputs.alias }}
          VERSION_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          set -euo pipefail

          if [[ "$DEPLOYMENT_TYPE" == "production" ]]; then
            {
              echo "### Production deployment"
              echo
              echo "- https://sshawn9.com"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          worker_name="sshawn9-com-preview"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            stable_url="$VERSION_URL"
            version_id="$(
              printf '%s\n' "$COMMAND_OUTPUT" \
                | sed -nE 's/.*Current Version ID: ([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}).*/\1/p' \
                | tail -n 1
            )"
            version_prefix="${version_id:0:8}"
            version_url="$(
              printf '%s\n' "$stable_url" \
                | sed -E "s#^https://${worker_name}\\.#https://${version_prefix}-${worker_name}.#"
            )"
            if [[ -z "$version_id" || -z "$stable_url" || "$version_url" == "$stable_url" ]]; then
              echo "Unable to resolve main preview URLs from the Wrangler deployment output." >&2
              exit 1
            fi
          else
            version_url="$VERSION_URL"
            # Wrangler records both URLs, but wrangler-action exposes only the
            # immutable preview URL as deployment-url for versions upload.
            stable_url="$(
              printf '%s\n' "$version_url" \
                | sed -E "s#^https://[^.]+-${worker_name}\\.#https://${PREVIEW_ALIAS}-${worker_name}.#"
            )"
            if [[ -z "$version_url" || "$stable_url" == "$version_url" ]]; then
              echo "Unable to derive the stable preview URL from: $version_url" >&2
              exit 1
            fi
          fi

          echo "stable-url=$stable_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployment"
            echo
            echo "- Stable branch URL: $stable_url"
            echo "- Immutable version URL: $version_url"
          } >> "$GITHUB_STEP_SUMMARY"
