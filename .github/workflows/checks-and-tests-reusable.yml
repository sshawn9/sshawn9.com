name: Reusable Checks and Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  tree-hash:
    runs-on: ubuntu-latest
    outputs:
      tree_hash: ${{ steps.tree-hash.outputs.tree_hash }}
    steps:
      - id: tree-hash
        name: Get repository tree hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree_hash=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha')
          if [[ ! "$tree_hash" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::GitHub returned an invalid repository tree hash'
            exit 1
          fi
          echo "tree_hash=$tree_hash" >> "$GITHUB_OUTPUT"

  checks-and-tests-execution:
    needs: tree-hash
    concurrency:
      group: checks-and-tests-${{ needs.tree-hash.outputs.tree_hash }}
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/checks-and-tests-execution.yml
    with:
      tree_hash: ${{ needs.tree-hash.outputs.tree_hash }}
