name: Verify site

on:
  workflow_call:
    inputs:
      upload_preview:
        description: Upload the verified preview build for a deployment job
        required: false
        type: boolean
        default: false
      upload_production:
        description: Upload the verified production build for a deployment job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # test:e2e includes the build; do not rebuild between verification and upload.
      - name: Build and test preview site
        run: npm run test:e2e
        env:
          SITE_MODE: preview
          SITE_BUILD_ID: preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload verified preview site
        if: ${{ inputs.upload_preview }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview-${{ github.sha }}
          path: apps/site/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Build and test production site
        if: ${{ inputs.upload_production }}
        run: npm run test:e2e
        env:
          SITE_MODE: production
          SITE_BUILD_ID: production-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload verified production site
        if: ${{ inputs.upload_production }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-production-${{ github.sha }}
          path: apps/site/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/site/test-results/
          retention-days: 7
          if-no-files-found: ignore
