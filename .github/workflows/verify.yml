name: Verify site

on:
  workflow_call:
    inputs:
      upload_preview:
        description: Upload the verified preview build for a deployment job
        required: false
        type: boolean
        default: false
      upload_production:
        description: Upload the verified production build for a deployment job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: devenv shell bash -- --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm exec -- playwright install --with-deps chromium
      # test includes unit tests, one build, and browser tests; do not rebuild before upload.
      - name: Build and test preview site
        run: npm test
        env:
          SITE_MODE: preview
      - name: Upload verified preview site
        if: ${{ inputs.upload_preview }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview-${{ github.sha }}
          path: apps/site/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Build and test production site
        if: ${{ inputs.upload_production }}
        run: npm test
        env:
          SITE_MODE: production
      - name: Upload verified production site
        if: ${{ inputs.upload_production }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-production-${{ github.sha }}
          path: apps/site/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: tests/.results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
