name: Site CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve the existing lock key independently of the workflow display name.
  group: site-Site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    uses: ./.github/workflows/site-validation.yml
    with:
      upload_preview: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') }}
      upload_production: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

  deploy-preview:
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && !github.event.deleted }}
    needs: verify
    concurrency:
      group: deploy-preview-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/site-deployment.yml
    with:
      artifact_name: site-preview-${{ github.sha }}
      deployment_type: preview
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      unsplash_access_key: ${{ secrets.UNSPLASH_ACCESS_KEY }}

  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.deleted }}
    needs: verify
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    uses: ./.github/workflows/site-deployment.yml
    with:
      artifact_name: site-production-${{ github.sha }}
      deployment_type: production
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      unsplash_access_key: ${{ secrets.UNSPLASH_ACCESS_KEY }}
